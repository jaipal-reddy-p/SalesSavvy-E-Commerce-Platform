spring.application.name=salessavvy
server.port=9090
spring.datasource.url=jdbc:mysql://localhost:3306/salessavvy
spring.datasource.username=root
spring.datasource.password=root
#spring.jpa.hibernate.ddl-auto=update
spring.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
jwt.secret=your-very-long-secure-secret-key-for-production-1234567890123456789
jwt.expiration=3600000
spring.jpa.hibernate.ddl-auto=validate
#toknow to sql errors
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#Enable CORS for specific endpoints
spring.web.cors.allowed-origin-patterns=http://localhost:5173 
spring.web.cors.exposed-headers=* 
spring.web.cors.max-age=36000 
spring.web.cors.allowed-origins=http://localhost:5173 
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS 
spring.web.cors.allowed-headers=Content-Type,Authorization 
spring.web.cors.allow-credentials=true

logging.level.root=INFO 
logging.level.org.springframework.web=INFO

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email
spring.mail.password=app_password
spring.mail.protocol=smtp

# Gmail-specific properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

#integrating razorpay
razorpay.key_id=your_razorpay_id
razorpay.key_secret=your_razorpay_password
